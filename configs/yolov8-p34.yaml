# YOLOv8 detection head truncated to P3/8 + P4/16 — no P5/32 branch.
#
# Rationale (Phase 6)
# -------------------
# Parameter profiling of stock YOLOv8n showed the P5/32 pathway — backbone
# layers 7/8/9 plus head layers 19/21, and the P5 branch of the Detect head —
# accounts for ~52% of all weights. P5/32 exists to detect objects roughly
# >=320px in a 640px frame, i.e. a person occupying half the frame height.
# In fixed-mount overhead CCTV that case essentially never occurs, so on this
# domain that half of the network is capacity the deployment never uses.
#
# This config removes it: SPPF moves onto P4, the FPN/PAN becomes two-scale,
# and Detect regresses at strides [8, 16] only.
#
# Note this is a domain-specific trade, not a general improvement. It gives up
# large-object detection outright. See README Phase 6 for the measured
# accuracy cost.
nc: 1
scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  t: [0.33, 0.1875, 1024]
  p: [0.33, 0.125, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4
  - [-1, 3, C2f, [128, True]]      # 2
  - [-1, 1, Conv, [256, 3, 2]]     # 3-P3/8
  - [-1, 6, C2f, [256, True]]      # 4
  - [-1, 1, Conv, [512, 3, 2]]     # 5-P4/16
  - [-1, 6, C2f, [512, True]]      # 6
  - [-1, 1, SPPF, [512, 5]]        # 7  (SPPF relocated from P5 to P4)

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]      # 9  cat backbone P3
  - [-1, 3, C2f, [256]]            # 10 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]     # 11
  - [[-1, 7], 1, Concat, [1]]      # 12 cat head P4
  - [-1, 3, C2f, [512]]            # 13 (P4/16-medium)

  - [[10, 13], 1, Detect, [nc]]    # 14 Detect(P3, P4)
